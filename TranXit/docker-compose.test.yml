networks:
  e2e-backend:
    driver: bridge

services:
  ocelotapigw:
    image: tranxit-e2e-api-gateway
    build:
      context: .
      dockerfile: OcelotApiGw/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedOrigins__0: "http://127.0.0.1:${TRANXIT_E2E_FRONTEND_PORT:-3100}"
      AllowedOrigins__1: "http://localhost:${TRANXIT_E2E_FRONTEND_PORT:-3100}"
      Jwt__Issuer: TranXIT.AccountService
      Jwt__Audience: TranXIT.ApiClients
      Jwt__RequireHttpsMetadata: "false"
      SharedJwtSecrets__Key: "${TRANXIT_E2E_JWT_SECRET:?Set TRANXIT_E2E_JWT_SECRET for E2E}"
    ports:
      - "${TRANXIT_E2E_GATEWAY_PORT:-18188}:8080"
    networks:
      - e2e-backend
    depends_on:
      accountservice:
        condition: service_started
      courierjobservice:
        condition: service_started

  accountservice:
    image: tranxit-e2e-account-service
    build:
      context: .
      dockerfile: AccountService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedOrigins__0: "http://127.0.0.1:${TRANXIT_E2E_FRONTEND_PORT:-3100}"
      AllowedOrigins__1: "http://localhost:${TRANXIT_E2E_FRONTEND_PORT:-3100}"
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=Tranxit_Account_E2E;User Id=sa;Password=${TRANXIT_E2E_SA_PASSWORD:?Set TRANXIT_E2E_SA_PASSWORD for E2E};TrustServerCertificate=True;Encrypt=False"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: "${TRANXIT_E2E_RABBITMQ_USERNAME:?Set TRANXIT_E2E_RABBITMQ_USERNAME for E2E}"
      RabbitMQ__Password: "${TRANXIT_E2E_RABBITMQ_PASSWORD:?Set TRANXIT_E2E_RABBITMQ_PASSWORD for E2E}"
      Jwt__Issuer: TranXIT.AccountService
      Jwt__Audience: TranXIT.ApiClients
      Jwt__RequireHttpsMetadata: "false"
      SharedJwtSecrets__Key: "${TRANXIT_E2E_JWT_SECRET:?Set TRANXIT_E2E_JWT_SECRET for E2E}"
      MailSettings__DisableSending: "true"
    networks:
      - e2e-backend
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  courierjobservice:
    image: tranxit-e2e-courierjob-service
    build:
      context: .
      dockerfile: CourierJobService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedOrigins__0: "http://127.0.0.1:${TRANXIT_E2E_FRONTEND_PORT:-3100}"
      AllowedOrigins__1: "http://localhost:${TRANXIT_E2E_FRONTEND_PORT:-3100}"
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=Tranxit_CourierJob_E2E;User Id=sa;Password=${TRANXIT_E2E_SA_PASSWORD:?Set TRANXIT_E2E_SA_PASSWORD for E2E};TrustServerCertificate=True;Encrypt=False"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: "${TRANXIT_E2E_RABBITMQ_USERNAME:?Set TRANXIT_E2E_RABBITMQ_USERNAME for E2E}"
      RabbitMQ__Password: "${TRANXIT_E2E_RABBITMQ_PASSWORD:?Set TRANXIT_E2E_RABBITMQ_PASSWORD for E2E}"
      Jwt__Issuer: TranXIT.AccountService
      Jwt__Audience: TranXIT.ApiClients
      Jwt__RequireHttpsMetadata: "false"
      SharedJwtSecrets__Key: "${TRANXIT_E2E_JWT_SECRET:?Set TRANXIT_E2E_JWT_SECRET for E2E}"
      MailSettings__DisableSending: "true"
    networks:
      - e2e-backend
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${TRANXIT_E2E_SA_PASSWORD:?Set TRANXIT_E2E_SA_PASSWORD for E2E}"
    ports:
      - "${TRANXIT_E2E_SQL_PORT:-11488}:1433"
    networks:
      - e2e-backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\")"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: "${TRANXIT_E2E_RABBITMQ_USERNAME:?Set TRANXIT_E2E_RABBITMQ_USERNAME for E2E}"
      RABBITMQ_DEFAULT_PASS: "${TRANXIT_E2E_RABBITMQ_PASSWORD:?Set TRANXIT_E2E_RABBITMQ_PASSWORD for E2E}"
    ports:
      - "${TRANXIT_E2E_RABBITMQ_PORT:-25688}:5672"
      - "${TRANXIT_E2E_RABBITMQ_MANAGEMENT_PORT:-25689}:15672"
    networks:
      - e2e-backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
