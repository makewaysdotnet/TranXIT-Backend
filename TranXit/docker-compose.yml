version: '3.4'

networks:
  backend:
  

services:

  ocelotapigw:
    container_name: api-gateway
    image: ${DOCKER_REGISTRY-}ocelotapigw
    build:
      context: .
      dockerfile: OcelotApiGw/Dockerfile
    ports:
    - 61260:8080
    networks:
    - backend


  accountdb:
    container_name: account-db
    image: mcr.microsoft.com/mssql/server:2019-latest
    ports:
     - 1433:1433
    environment:
    - ACCEPT_EULA=Y
    - MSSQL_SA_PASSWORD=Hamza_1234
    volumes:
    - ./data:/var/opt/mssql/data
    networks:
    - backend

  accountservice:
    container_name: account-service
    image: ${DOCKER_REGISTRY-}accountservice
    build:
      context: .
      dockerfile: AccountService/Dockerfile
    depends_on:
    - accountdb
    networks:
    - backend
