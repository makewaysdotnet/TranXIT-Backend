name: Local Recovery Matrix

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:
    inputs:
      counterpart_sha:
        description: Optional operator-selected frontend full lowercase 40-character SHA (never a branch or tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: disposable recovery matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: TranXIT-Backend/TranXit
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: TranXIT-Backend
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check immutable pairing and deploy-admission contracts
        run: node --test ../.github/scripts/*.test.mjs

      - name: Validate and resolve immutable frontend selection
        id: frontend-ref
        env:
          COUNTERPART_SHA: ${{ inputs.counterpart_sha || '' }}
        run: node ../.github/scripts/ci-pair.mjs resolve ../.github/ci-pair.json makewaysdotnet/TranXIT-Backend pairing-evidence/selection.json

      - name: Checkout exact frontend commit
        uses: actions/checkout@v4
        with:
          repository: makewaysdotnet/TranXit-Frontend
          ref: ${{ steps.frontend-ref.outputs.sha }}
          path: TranXit-Frontend
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and record exact pair
        run: node ../.github/scripts/ci-pair.mjs record pairing-evidence/selection.json makewaysdotnet/TranXIT-Backend .. ../../TranXit-Frontend pairing-evidence/source-pair.json

      - name: Verify local Docker
        run: docker info

      - name: Check test-wrapper isolation
        run: node --test scripts/tests/recovery/runtime.safety.test.mjs

      - name: Check deployment admission and recovery contracts
        run: bash scripts/tests/deploy-safety-test.sh

      - name: Check fixture repository preparation
        run: |
          docker build -t tranxit-recovery-checks scripts/tests/recovery
          docker run --rm --network none --entrypoint bash tranxit-recovery-checks /harness/checkout-safety-test.sh attached
          docker run --rm --network none --entrypoint bash tranxit-recovery-checks /harness/checkout-safety-test.sh detached
          docker run --rm --network none --entrypoint bash tranxit-recovery-checks /harness/checkout-safety-test.sh foreign-owner
          docker run --rm --network none --entrypoint bash --env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin tranxit-recovery-checks /harness/probe-safety-test.sh

      # Only private fixture clones and generated test credentials are used.
      - name: Run real recovery matrix and credibility check
        run: node scripts/tests/recovery/runtime.mjs

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-${{ github.run_attempt }}
          path: |
            TranXIT-Backend/TranXit/Tests/TranXit.IntegrationTests/TestResults/tranxit-f01-test-*/
            TranXIT-Backend/TranXit/pairing-evidence/
          if-no-files-found: warn
          retention-days: 30
