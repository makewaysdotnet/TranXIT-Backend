name: Deploy TranXIT
run-name: Deploy ${{ inputs.environment }} backend ${{ inputs.sha }} frontend ${{ inputs.frontend_ref }} (${{ inputs.migration_policy }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      sha:
        description: Backend full 40-character lowercase commit SHA to deploy
        required: true
        type: string
      frontend_ref:
        description: Frontend full 40-character lowercase commit SHA to deploy
        required: true
        type: string
      migration_policy:
        description: Rollback policy reviewed for this release's migrations
        required: true
        default: expand-contract
        type: choice
        options:
          - expand-contract
          - restore-required
      allow_first_deploy:
        description: Explicitly acknowledge that no known-green rollback marker exists
        required: true
        default: false
        type: boolean

concurrency:
  group: tranxit-deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: deploy-${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout reviewed workflow controls
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify source and approval admission contracts
        run: node --test .github/scripts/*.test.mjs

      - name: Validate immutable inputs and production approval before SSH
        env:
          TARGET_ENV: ${{ inputs.environment }}
          BACKEND_SHA: ${{ inputs.sha }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          MIGRATION_POLICY: ${{ inputs.migration_policy }}
          ALLOW_FIRST_DEPLOY: ${{ inputs.allow_first_deploy }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/deploy-admission.mjs

          if [ "$TARGET_ENV" = "production" ]; then
            {
              echo "## Production approval gate"
              echo
              echo "Production reviewer policy and this fresh run's independent direct-user approval were checked before SSH."
              echo
              echo "- Backend SHA: \`$BACKEND_SHA\`"
              echo "- Frontend SHA: \`$FRONTEND_REF\`"
              echo "- Migration policy: \`$MIGRATION_POLICY\`"
              echo "- First deploy acknowledged: \`$ALLOW_FIRST_DEPLOY\`"
              echo
              echo "The reviewer must confirm the same backend SHA, frontend SHA, and migration policy were"
              echo "deployed and smoked successfully on staging before approving this production job."
              echo "Source identity does not enforce build-once image-digest promotion; that release gate remains open."
              echo "The admin-bypass setting is not exposed by the policy API; verify it separately in repository settings."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.TRANXIT_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Missing TRANXIT_DEPLOY_SSH_KEY secret"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tranxit_deploy_key
          chmod 600 ~/.ssh/tranxit_deploy_key

      - name: Resolve deploy host
        id: host
        env:
          TARGET_ENV: ${{ inputs.environment }}
          STAGING_HOST: ${{ secrets.TRANXIT_STAGING_HOST }}
          PRODUCTION_HOST: ${{ secrets.TRANXIT_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.TRANXIT_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.TRANXIT_DEPLOY_PORT }}
        run: |
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::Missing TRANXIT_DEPLOY_USER secret"
            exit 1
          fi

          if [ "$TARGET_ENV" = "staging" ]; then
            host="$STAGING_HOST"
          else
            host="$PRODUCTION_HOST"
          fi

          if [ -z "$host" ]; then
            echo "::error::Missing deploy host secret for $TARGET_ENV"
            exit 1
          fi

          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$DEPLOY_USER" >> "$GITHUB_OUTPUT"
          echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Install pinned deploy host key
        env:
          KNOWN_HOSTS: ${{ secrets.TRANXIT_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ steps.host.outputs.host }}
          DEPLOY_PORT: ${{ steps.host.outputs.port }}
        run: |
          set -euo pipefail
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Missing TRANXIT_DEPLOY_KNOWN_HOSTS secret"
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          lookup="$DEPLOY_HOST"
          if [ "$DEPLOY_PORT" != "22" ]; then
            lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          if ! ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::Pinned known_hosts data does not contain the selected deploy host"
            exit 1
          fi

      - name: Run remote deploy
        id: deploy
        env:
          TARGET_ENV: ${{ inputs.environment }}
          BACKEND_SHA: ${{ inputs.sha }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          MIGRATION_POLICY: ${{ inputs.migration_policy }}
          ALLOW_FIRST_DEPLOY: ${{ inputs.allow_first_deploy }}
          DEPLOY_HOST: ${{ steps.host.outputs.host }}
          DEPLOY_PORT: ${{ steps.host.outputs.port }}
          DEPLOY_USER: ${{ steps.host.outputs.user }}
        run: |
          set -euo pipefail
          # A separately reviewed controller survives application checkout/rollback. The shared
          # lock also prevents an operator from switching its version during script startup.
          printf -v deploy_command \
            'flock --shared %q env TRANXIT_DEPLOY_PROJECT_DIR=%q bash %q --env %q --sha %q --frontend-ref %q --migration-policy %q' \
            /opt/tranxit/controller.lock \
            /opt/tranxit/backend/TranXit \
            /opt/tranxit/controller/scripts/deploy.sh \
            "$TARGET_ENV" \
            "$BACKEND_SHA" \
            "$FRONTEND_REF" \
            "$MIGRATION_POLICY"
          if [ "$ALLOW_FIRST_DEPLOY" = "true" ]; then
            deploy_command+=" --allow-first-deploy"
          fi
          ssh -i ~/.ssh/tranxit_deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$deploy_command" \
            2>&1 | tee deploy-output.log

      - name: Summary
        if: always()
        env:
          TARGET_ENV: ${{ inputs.environment }}
          BACKEND_SHA: ${{ inputs.sha }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          MIGRATION_POLICY: ${{ inputs.migration_policy }}
          ALLOW_FIRST_DEPLOY: ${{ inputs.allow_first_deploy }}
        run: |
          {
            echo "## TranXIT deploy"
            echo
            echo "- Environment: \`$TARGET_ENV\`"
            echo "- Backend SHA: \`$BACKEND_SHA\`"
            echo "- Frontend SHA: \`$FRONTEND_REF\`"
            echo "- Migration policy: \`$MIGRATION_POLICY\`"
            echo "- First deploy acknowledged: \`$ALLOW_FIRST_DEPLOY\`"
            echo "- Result: \`${{ job.status }}\`"
            echo
            echo "### Deploy output"
            echo
            echo '```text'
            tail -n 120 deploy-output.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
